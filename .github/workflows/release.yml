name: Release source apps
on:
  push:
    tags: ['v*']
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm test && npm run package:app
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          cd release && sha256sum -c SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "Delta Media Sources $GITHUB_REF_NAME" --notes-file RELEASE.md release/*.delta-app release/SHA256SUMS
